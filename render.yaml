# Render Blueprint: New > Blueprint > pick this repo.
# You'll be asked for the values marked sync: false.
services:
  - type: web
    name: drop-studio-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false # Postgres connection string (Neon free tier recommended, see README)
      - key: APP_PASSWORD
        sync: false # the password you'll sign in with
      - key: SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: FRONTEND_ORIGIN
        value: https://drop-studio-web.onrender.com

  - type: web
    name: drop-studio-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: API_URL
        value: https://drop-studio-api.onrender.com
